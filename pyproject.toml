[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-tianai-captcha"
version = "1.0.0"
description = "天爱验证码(TAC) Django 插件 - 支持滑块、旋转、滑动还原、文字点选等多种行为验证码"
readme = "README.md"
license = {text = "MulanPSL-2.0"}
requires-python = ">=3.8"
authors = [
    {name = "tianai-captcha team"},
]
keywords = ["django", "captcha", "slider", "rotate", "word-click", "verification", "天爱验证码"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 3.2",
    "Framework :: Django :: 4.0",
    "Framework :: Django :: 4.1",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MulanPSL-2.0",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "Django>=3.2",
    "Pillow>=8.0.0",
]

[project.optional-dependencies]
redis = ["redis>=4.0.0"]
dev = [
    "pytest",
    "pytest-django",
    "redis>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/trustedinster/django-tianai-captcha"
Repository = "https://github.com/trustedinster/django-tianai-captcha"
Documentation = "http://doc.captcha.tianai.cloud"

[tool.setuptools.packages.find]
include = ["django_tianai_captcha*"]

[tool.setuptools.package-data]
"django_tianai_captcha" = [
    "resources/**/*",
    "templates/**/*",
    "static/**/*",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
